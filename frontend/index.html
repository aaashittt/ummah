<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
  <title>Ummah</title>
  <style>
    #chat-window { 
      height: 400px; 
      border: 1px solid #ccc; 
      padding: 20px; 
      overflow-y: scroll;
      margin-bottom: 10px;
      background: #f9f9f9;
      font-family: Arial, sans-serif;
    }
    .user-message { color: blue; margin: 5px 0; }
    .bot-message { color: green; margin: 5px 0; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>Chat with AI</h1>
  <div id="chat-window"></div>
  <input type="text" id="question-input" placeholder="Type your question...">
  <button id="send-button">Send</button>
  <script src="script.js"></script>
</body>
</html>
